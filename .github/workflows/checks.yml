name: Clean checkout checks
on:
  push:
    branches: [master, 'codex/**', wip/byoa-restoration-20261105]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Public file boundary
        run: python tools/check_public_files.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Frontend production build
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Install browser test runtime
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/blastlab-browser-tests" --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/blastlab-browser-tests/node_modules/.bin/playwright" install --with-deps chromium
          echo "BLASTLAB_PLAYWRIGHT_MODULE=$RUNNER_TEMP/blastlab-browser-tests/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Public backend tests
        run: python -m unittest discover -q
