<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">BlastLab hosted BYOA execution architecture</title><desc id="desc">Developer source enters a trusted Vultr controller, which supplies cases to an isolated Python worker. Only bounded inference is mediated through the trusted host to Vultr Serverless Inference. Model credentials stay on the host. The host verifies teardown before returning a report. External connector mode is a separate uncontained option. This diagram is an explanation, not telemetry.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#acf0d4"/></marker></defs><rect width="1200" height="900" fill="#101416"/><g font-family="Arial,sans-serif"><text x="48" y="57" fill="#f3f0e8" font-size="24" font-weight="700">BLAST/LAB</text><text x="1150" y="54" text-anchor="end" fill="#a9b2ae" font-size="12">ARCHITECTURE DIAGRAM / NOT TELEMETRY</text><text x="48" y="113" fill="#f3f0e8" font-size="36" font-weight="700">Your agent. Tested inside Vultr.</text><rect x="44" y="156" width="1112" height="470" fill="#151e1a" stroke="#638574"/><text x="68" y="188" fill="#acf0d4" font-size="13">VULTR CLOUD COMPUTE / TRUSTED CONTROL LAYER</text><rect x="76" y="241" width="310" height="181" fill="#202e27" stroke="#779387"/><text x="98" y="276" fill="#a9b2ae" font-size="12">CAMPAIGN CONTROLLER</text><text x="98" y="313" fill="#f3f0e8" font-size="23" font-weight="700">Plan · inspect · remove</text><text x="98" y="347" fill="#c5d3cb" font-size="15">Task, rules and uploaded source</text><text x="98" y="375" fill="#c5d3cb" font-size="15">Provider credentials stay here</text><rect x="564" y="233" width="536" height="281" fill="#1b3024" stroke="#acf0d4" stroke-width="2"/><text x="588" y="270" fill="#acf0d4" font-size="13">DISPOSABLE DOCKER WORKER</text><text x="588" y="314" fill="#f3f0e8" font-size="30" font-weight="700">Your agent code</text><text x="588" y="352" fill="#d1dfd6" font-size="16">No external network · no host mounts</text><text x="588" y="382" fill="#d1dfd6" font-size="16">Read-only root · temporary workspace</text><text x="588" y="412" fill="#d1dfd6" font-size="16">256 MB · 0.5 CPU · 48 processes · 10 minutes</text><text x="588" y="478" fill="#c5d3cb" font-size="14">Credential-free inference bridge → trusted host</text><path d="M397 305H548" stroke="#acf0d4" stroke-width="2" marker-end="url(#a)"/><text x="473" y="287" text-anchor="middle" fill="#acf0d4" font-size="12">CASES + SOURCE</text><path d="M548 394H397" stroke="#acf0d4" stroke-width="2" marker-end="url(#a)"/><text x="473" y="422" text-anchor="middle" fill="#acf0d4" font-size="12">RETURNED EVIDENCE</text><rect x="76" y="665" width="310" height="117" fill="#111a16" stroke="#638574"/><text x="98" y="698" fill="#acf0d4" font-size="12">VULTR SERVERLESS INFERENCE</text><text x="98" y="731" fill="#f3f0e8" font-size="18">Attacks + agent model calls</text><text x="98" y="758" fill="#a9b2ae" font-size="13">Fixed provider · bounded host mediation</text><path d="M232 432V650" stroke="#acf0d4" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/><text x="564" y="559" fill="#f3f0e8" font-size="18">Report released after host checks + verified teardown</text><text x="564" y="589" fill="#a9b2ae" font-size="13">Tool intents remain agent-declared; internal side effects are not individually attested.</text><text x="48" y="837" fill="#c0cec5" font-size="15">External connector mode: developer's environment, without hosted isolation.</text><text x="48" y="872" fill="#85978c" font-size="12">Hosted runtime: standard-library Python. Source fingerprint and runtime checks are retained in the report.</text></g></svg>